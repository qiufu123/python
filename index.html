<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中秋月饼铺</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#04061a 0%,#0b1230 45%,#17204a 80%,#1e2a58 100%);
  color:#f6efe0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
main{max-width:1000px;margin:auto;padding:36px 16px 60px;position:relative;z-index:1}

/* ================= 夜空 ================= */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky::before{content:"";position:absolute;inset:0;
  background:radial-gradient(900px 520px at 85% -10%,rgba(255,235,170,.14),transparent 62%)}
.moon{position:absolute;top:-72px;right:7%;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fffdf0,#ffeda8 55%,#f2c95c 100%);
  box-shadow:0 0 70px 25px rgba(255,224,130,.28),0 0 190px 80px rgba(255,200,80,.12);
  pointer-events:auto;cursor:pointer;z-index:2}
.moon::after{content:"";position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(circle at 68% 72%,rgba(220,180,90,.22),transparent 55%)}
.moon.shake{animation:moonShake .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes moonShake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-6px,3px) scale(1.04)}
  30%{transform:translate(6px,-3px) scale(1.02)}
  45%{transform:translate(-4px,2px) scale(1.03)}
  60%{transform:translate(4px,-2px) scale(1.01)}
  80%{transform:translate(-2px,1px)}}

/* 月亮戳一戳提示 */
.moon-tip{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  padding:5px 12px;
  border-radius:99px;
  background:linear-gradient(135deg,rgba(255,225,150,.35),rgba(255,200,100,.20));
  border:1px solid rgba(255,215,120,.75);
  font-size:12px;
  color:#fff8dc;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 0 8px rgba(255,200,90,.9);
  box-shadow:0 4px 14px rgba(255,180,60,.35);
  animation:moonTipPulse 2s ease-in-out infinite;
}
@keyframes moonTipPulse{
  0%,100%{opacity:.6;transform:translateX(-50%) scale(.95)}
  50%    {opacity:1;transform:translateX(-50%) scale(1.08)}
}

.stars i{position:absolute;background:#fff;border-radius:50%;opacity:.5}
.stars i.tw{animation:twk 3.4s ease-in-out infinite}
@keyframes twk{
  0%,100%{opacity:.15;transform:scale(.7)}
  50%{opacity:.9;transform:scale(1.2)}}

.cloud{position:absolute;border-radius:50%;filter:blur(20px);pointer-events:none}
.c1{width:420px;height:120px;top:14%;left:-420px;
  background:radial-gradient(ellipse,rgba(255,255,255,.10),transparent 70%);
  animation:drift 90s linear infinite}
.c2{width:640px;height:180px;top:42%;left:-640px;
  background:radial-gradient(ellipse,rgba(255,255,255,.07),transparent 70%);
  animation:drift 130s linear infinite -40s}
.c3{width:340px;height:100px;top:68%;left:-340px;
  background:radial-gradient(ellipse,rgba(255,255,255,.06),transparent 70%);
  animation:drift 110s linear infinite -70s}
@keyframes drift{to{transform:translateX(calc(100vw + 700px))}}

.moon-ripple{position:fixed;border-radius:50%;pointer-events:none;z-index:1;
  border:2px solid rgba(255,230,160,.7);
  transform:translate(-50%,-50%) scale(.3);opacity:.9}
.moon-ripple.go{animation:rippleOut 2s ease-out forwards}
@keyframes rippleOut{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(6);opacity:0}}

.moon-poem{position:fixed;transform:translate(-50%,0);z-index:10010;
  color:#fff8dc;font-size:16px;font-weight:700;letter-spacing:2px;
  text-shadow:0 2px 14px rgba(255,190,90,.9);
  pointer-events:none;white-space:nowrap;
  animation:poemUp 2.6s ease-out forwards}
@keyframes poemUp{
  0%{opacity:0;transform:translate(-50%,20px) scale(.8)}
  20%{opacity:1;transform:translate(-50%,0) scale(1)}
  80%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-40px) scale(.95)}}

.tips{position:fixed;bottom:14px;left:14px;z-index:5;
  font-size:11.5px;color:#ffffff4d;letter-spacing:1px;line-height:1.9;
  pointer-events:none;user-select:none}

.osmanthus{position:fixed;pointer-events:none;z-index:1;
  color:#ffd97a;text-shadow:0 0 6px rgba(255,200,100,.7);
  will-change:transform,opacity;user-select:none}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0);opacity:0}
  10%{opacity:.85}
  90%{opacity:.85}
  100%{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:0}}

/* ================= 左侧滑动提示 ================= */
.slide-hint{
  position:fixed;
  left:12px;
  top:50%;
  transform:translate(calc(-50% + 50px),calc(-50% - 80px));
  z-index:8;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:16px 10px 14px;
  border-radius:99px;
  cursor:pointer;
  background:linear-gradient(180deg,rgba(255,225,150,.28),rgba(255,150,60,.10));
  border:2px solid rgba(255,215,120,.75);
  box-shadow:0 10px 32px rgba(255,170,50,.45),
             inset 0 0 24px rgba(255,200,90,.18);
  animation:slideFloat 2.6s ease-in-out infinite,
            slideGlow 2.6s ease-in-out infinite;
  transition:transform .25s, background .25s;
  user-select:none;pointer-events:auto
}
@keyframes slideFloat{
  0%,100%{transform:translate(calc(-50% + 50px),calc(-50% - 80px))}
  50%{transform:translate(calc(-50% + 50px),calc(-50% - 88px))}
}
@keyframes slideGlow{
  0%,100%{box-shadow:0 10px 32px rgba(255,170,50,.42),
                     inset 0 0 24px rgba(255,200,90,.15)}
  50%    {box-shadow:0 10px 52px rgba(255,190,70,.95),
                     inset 0 0 34px rgba(255,220,120,.42)}}
.slide-hint:hover{background:linear-gradient(180deg,rgba(255,225,150,.42),rgba(255,150,60,.20))}
.slide-hint:active{transform:translate(calc(-50% + 50px),calc(-50% - 80px)) scale(.94)}
.slide-hint.hide{opacity:0;pointer-events:none;transition:opacity .5s}

.slide-hint::before,
.slide-hint::after{
  content:"✦";position:absolute;left:50%;
  color:#ffe9a8;font-size:12px;
  text-shadow:0 0 10px rgba(255,200,90,1);
  animation:starTwinkle 2s ease-in-out infinite;
  transform:translateX(-50%)}
.slide-hint::before{top:-8px}
.slide-hint::after{bottom:-8px;animation-delay:1s}
@keyframes starTwinkle{
  0%,100%{opacity:.35;transform:translateX(-50%) scale(.8)}
  50%    {opacity:1;  transform:translateX(-50%) scale(1.35)}}

.sh-moon{font-size:26px;line-height:1;
  animation:moonPulse 1.8s ease-in-out infinite}
@keyframes moonPulse{
  0%,100%{transform:scale(1) rotate(0)}
  50%{transform:scale(1.18) rotate(8deg)}}

.sh-text{writing-mode:vertical-rl;text-orientation:upright;
  font-size:14px;font-weight:900;letter-spacing:5px;
  color:#fff5d0;padding:4px 0;
  text-shadow:0 0 10px rgba(255,200,90,.95),
              0 0 22px rgba(255,180,60,.55)}

.sh-arrow{font-size:22px;color:#ffe9a8;font-weight:900;line-height:1;
  text-shadow:0 0 12px rgba(255,200,90,1);
  animation:arrowBounce 1.2s ease-in-out infinite}
@keyframes arrowBounce{
  0%,100%{transform:translateY(0);opacity:.65}
  50%    {transform:translateY(8px);opacity:1}}

/* ================= 名字输入区 ================= */
.bar{position:relative;display:flex;justify-content:center;align-items:center;gap:10px;
  flex-wrap:wrap;margin-bottom:34px}
.bar label{font-size:15px;color:#ffffffcc;line-height:42px;font-weight:600}
.bar input{font:inherit;font-size:16px;width:220px;padding:12px 20px;text-align:center;
  border-radius:99px;border:2px solid #ffdc8c8c;background:#ffffff14;color:#fff8e2;outline:none;
  box-shadow:0 0 0 0 rgba(255,200,80,.5),0 4px 18px rgba(255,200,80,.18);
  transition:border-color .3s, box-shadow .3s}
.bar input:focus{border-color:#ffdc8c;
  box-shadow:0 0 0 5px rgba(255,200,80,.2),0 4px 22px rgba(255,200,80,.4)}

.name-hint{position:absolute;top:-44px;left:50%;
  padding:7px 18px;border-radius:99px;
  background:linear-gradient(135deg,#ffeaa8,#f5c04f);
  color:#5a2e00;font-size:13px;font-weight:800;white-space:nowrap;
  box-shadow:0 6px 22px rgba(255,180,60,.55);
  animation:hintBob 1.6s ease-in-out infinite;
  pointer-events:none;
  transition:opacity .4s, transform .4s}
.name-hint::after{content:"";position:absolute;bottom:-6px;left:50%;
  margin-left:-6px;border:6px solid transparent;
  border-top-color:#f5c04f;border-bottom:0}
.name-hint.hide{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.85)}
@keyframes hintBob{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-6px)}}

h1{margin:0 0 14px;text-align:center;font-size:clamp(22px,5vw,38px);letter-spacing:4px;
  background:linear-gradient(#fff9e2,#f8d271,#dc9a22);-webkit-background-clip:text;
  background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 16px rgba(255,190,70,.28))}
.status{display:block;width:fit-content;margin:0 auto 18px;padding:8px 22px;border-radius:99px;
  font-size:14px;color:#ffe9a8;background:#ffdc8c14;border:1px solid #ffdc8c38}
.status b{color:#fff3c4;font-size:17px}
.status.done{color:#0d1433;font-weight:700;background:linear-gradient(135deg,#ffeaa8,#f5c04f);
  border-color:transparent}
.btns{display:flex;justify-content:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.btns button{font:inherit;font-size:14px;padding:10px 24px;border-radius:99px;cursor:pointer;
  color:#ffe9a8;background:#ffdc8c1a;border:1px solid #ffdc8c5c;transition:.25s}
.btns button:hover{background:#ffdc8c33;transform:translateY(-2px);
  box-shadow:0 8px 22px #ffc85033}
.btns button:active{transform:translateY(0)}
.btns button.on{color:#0d1433;font-weight:700;
  background:linear-gradient(135deg,#ffeaa8,#f5c04f);border-color:transparent}

/* ================= 月饼铺 ================= */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.flavor{position:relative;padding:14px 18px 18px;border-radius:18px;
  background:#ffffff0b;border:1px solid #ffffff17;overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.28);cursor:pointer;
  transition:background .25s, border-color .25s}
.flavor:hover{background:#ffffff12;border-color:#ffffff2b}
.flavor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);
  box-shadow:0 0 16px var(--c)}
.head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.nm{font-size:15px;font-weight:600}
.cnt{margin-left:auto;font-size:12px;color:#ffffff73}
.cnt b{color:#ffe08a;font-size:13px}
.cakes{display:flex;flex-wrap:wrap;gap:9px;min-height:46px}
.cake{position:relative;width:46px;height:46px;padding:0;border:0;background:none;cursor:pointer}
.cake::before{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px #ffffff1f;opacity:0;transition:opacity .3s .12s}
.cake.taken{pointer-events:none}
.cake.taken::before{opacity:1}
.vis{display:block;width:100%;height:100%;transition:transform .22s,filter .22s,opacity .22s;position:relative}
.vis svg{display:block;width:100%;height:100%}
.cake:not(.taken):hover .vis{transform:translateY(-5px) scale(1.14);
  filter:drop-shadow(0 0 10px var(--c))}
.cake.taken .vis{transform:scale(0);opacity:0;
  transition:transform .15s ease-in,opacity .15s}

.cake.hidden-cake::after{content:"⭐";
  position:absolute;top:-4px;right:-4px;font-size:14px;
  filter:drop-shadow(0 0 6px rgba(255,220,120,.95));
  pointer-events:none}
.cake.hidden-cake .vis{
  filter:drop-shadow(0 0 8px #ffd76b) drop-shadow(0 0 18px #ffb040)}
.cake:not(.taken):hover.hidden-cake .vis{
  filter:drop-shadow(0 0 12px #ffd76b) drop-shadow(0 0 22px #ffb040)}

/* ================= 口味介绍卡 ================= */
.flavor-card{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
  width:min(300px,84vw);padding:22px 22px 20px;
  background:linear-gradient(160deg,#1a2450,#0d1433);
  border:1px solid rgba(255,220,140,.35);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(255,200,80,.18);
  z-index:10020;opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.flavor-card.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.fc-emoji{font-size:36px;text-align:center;margin-bottom:6px}
.fc-name{text-align:center;font-size:18px;font-weight:800;letter-spacing:2px;
  margin-bottom:10px;
  background:linear-gradient(#fff9e2,#f8d271,#dc9a22);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.fc-desc{text-align:center;font-size:13.5px;line-height:1.9;
  color:#fff0d2cc;letter-spacing:.8px}
.fc-close{display:block;margin:16px auto 0;font:inherit;font-size:13px;
  padding:8px 22px;border-radius:99px;cursor:pointer;
  color:#ffe9a8;background:#ffdc8c1a;border:1px solid #ffdc8c5c;
  transition:.25s}
.fc-close:hover{background:#ffdc8c33}
.fc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:10019;opacity:0;pointer-events:none;transition:opacity .3s}
.fc-backdrop.show{opacity:1;pointer-events:auto}

.hidden-banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-30px) scale(.7);
  z-index:10025;pointer-events:none;
  padding:14px 30px;border-radius:99px;
  background:linear-gradient(135deg,#fff3c4,#ffc466,#ff9d3c);
  color:#5a1e05;font-weight:900;font-size:16px;letter-spacing:1.5px;
  box-shadow:0 10px 40px rgba(255,180,70,.7);
  opacity:0;white-space:nowrap}
.hidden-banner.show{animation:hbShow 2.6s ease-out forwards}
@keyframes hbShow{
  0%{opacity:0;transform:translate(-50%,-30px) scale(.5)}
  15%{opacity:1;transform:translate(-50%,0) scale(1.08)}
  30%{transform:translate(-50%,0) scale(1)}
  80%{opacity:1;transform:translate(-50%,-8px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-30px) scale(.9)}}

/* ================= 兔子吃月饼 ================= */
.eat-rabbit{position:fixed;pointer-events:none;z-index:10000}
.er-svg{display:block;width:100%;height:100%;overflow:visible;transition:transform .3s ease}
.er-mouth{transition:transform .25s cubic-bezier(.34,1.56,.64,1);transform-origin:30px 57px}
.eat-rabbit.open .er-mouth{transform:scale(3.6,5.2)}
.eat-rabbit.chew .er-svg{animation:chewAnim .35s ease-in-out 3}
@keyframes chewAnim{
  0%,100%{transform:scale(1) translateY(0)}
  50%{transform:scale(1.08,.94) translateY(2px)}}
.eat-rabbit.burp .er-svg{animation:burpAnim .7s ease-out}
@keyframes burpAnim{
  0%{transform:scale(1)}
  25%{transform:scale(1.20,.86)}
  55%{transform:scale(.94,1.10)}
  100%{transform:scale(1)}}
.burp-text{position:fixed;transform:translate(-50%,-50%);
  font-size:28px;font-weight:900;color:#ffe08a;
  text-shadow:0 2px 12px #ffa040b0;
  z-index:10002;pointer-events:none;white-space:nowrap;
  animation:burpTextUp 1.7s ease-out forwards}
@keyframes burpTextUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  25%{opacity:1;transform:translate(-50%,-75%) scale(1.3)}
  60%{opacity:1;transform:translate(-50%,-105%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.9)}}

/* ================= 祝福区 ================= */
.bless{margin-top:40px;text-align:center;opacity:0;transform:translateY(18px);
  transition:.7s;pointer-events:none}
.bless.show{opacity:1;transform:none;pointer-events:auto}
.bless h2{margin:0 0 10px;font-size:clamp(20px,4vw,30px);letter-spacing:2px;
  background:linear-gradient(#fff9e2,#f8d271,#dc9a22);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.bless p{margin:0 0 20px;font-size:14px;color:#fff0d29e;letter-spacing:2px;line-height:1.9}
.bless .from-wuxi{font-size:12px;color:#fff0d273;letter-spacing:1.5px;
  font-style:italic;margin:-14px 0 20px}

.rabbit-wrap{display:flex;justify-content:center;margin-top:10px}
.rabbit{position:relative;width:180px;height:200px;cursor:pointer;
  animation:hop 1.6s ease-in-out infinite}
@keyframes hop{
  0%,100%{transform:translateY(0)}
  30%{transform:translateY(-14px)}
  50%{transform:translateY(0) scaleY(.96)}
  70%{transform:translateY(-6px)}}
.rabbit.clicked{animation:bigHop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes bigHop{
  0%{transform:translateY(0) scale(1)}
  25%{transform:translateY(-46px) scale(1.08)}
  45%{transform:translateY(-30px) scale(.96)}
  65%{transform:translateY(-16px) scale(1.05)}
  100%{transform:translateY(0) scale(1)}}
.rabbit svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 22px #00000059)}
.ear-l{transform-origin:36px 62px;animation:earL 2.4s ease-in-out infinite}
.ear-r{transform-origin:84px 62px;animation:earR 2.4s ease-in-out infinite .2s}
@keyframes earL{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}88%{transform:rotate(6deg)}}
@keyframes earR{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(14deg)}88%{transform:rotate(-6deg)}}
.eye{animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.blush{animation:blush 2.2s ease-in-out infinite}
@keyframes blush{0%,100%{opacity:.55}50%{opacity:.9}}
.tail{transform-origin:36px 156px;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.cake-hug{transform-origin:60px 150px;animation:hug 2s ease-in-out infinite}
@keyframes hug{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

.rabbit::before{content:"";position:absolute;inset:-12px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,220,140,.0) 50%,rgba(255,220,140,.10) 75%,transparent 88%);
  animation:rabbitHalo 3s ease-in-out infinite;pointer-events:none}
@keyframes rabbitHalo{
  0%,100%{opacity:.4;transform:scale(1)}
  50%{opacity:1;transform:scale(1.08)}}

.rabbit-bubble{position:fixed;transform:translate(-50%,-100%) scale(.4);
  background:#fff8e2;color:#4a3728;padding:7px 16px;border-radius:99px;
  font-size:13px;font-weight:700;white-space:nowrap;z-index:10005;
  pointer-events:none;opacity:0;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.rabbit-bubble.show{transform:translate(-50%,-190%) scale(1);opacity:1}
.rabbit-bubble::after{content:"";position:absolute;bottom:-6px;left:50%;
  transform:translateX(-50%);border:6px solid transparent;
  border-top-color:#fff8e2;border-bottom:0}

/* ================= 孔明灯许愿 ================= */
.wish-wrap{position:relative;margin-top:38px;
  padding:22px 14px 20px;border-radius:20px;
  background:linear-gradient(180deg,rgba(255,220,140,.06),rgba(255,220,140,.02));
  border:1px dashed rgba(255,220,140,.28);
  animation:wishBoxPulse 2.6s ease-in-out infinite}
@keyframes wishBoxPulse{
  0%,100%{border-color:rgba(255,220,140,.22);background:linear-gradient(180deg,rgba(255,220,140,.05),rgba(255,220,140,.01))}
  50%{border-color:rgba(255,220,140,.55);background:linear-gradient(180deg,rgba(255,220,140,.10),rgba(255,220,140,.03))}}
.wish-hint{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  padding:6px 18px;border-radius:99px;
  background:linear-gradient(135deg,#ffeaa8,#f5c04f);
  color:#5a2e00;font-size:13px;font-weight:800;white-space:nowrap;
  letter-spacing:.5px;
  box-shadow:0 6px 22px rgba(255,180,60,.55);
  animation:hintBob 1.6s ease-in-out infinite;
  pointer-events:none;
  transition:opacity .4s, transform .4s}
.wish-hint::after{content:"";position:absolute;bottom:-6px;left:50%;
  margin-left:-6px;border:6px solid transparent;
  border-top-color:#f5c04f;border-bottom:0}
.wish-hint.hide{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.85)}

.wish-bar{display:flex;justify-content:center;gap:10px;
  margin:8px auto 0;max-width:430px;padding:0 8px}
.wish-bar input{flex:1;font:inherit;font-size:15px;padding:13px 18px;border-radius:99px;
  border:2px solid #ffdc8c8c;background:#ffffff14;color:#fff8e2;outline:none;
  text-align:center;min-width:0;
  transition:border-color .3s, box-shadow .3s}
.wish-bar input:focus{border-color:#ffdc8c;

function playNote(freq, start, dur, vol) {

  const g = musicCtx.createGain();

  g.gain.setValueAtTime(0, start);

  g.gain.linearRampToValueAtTime(vol * 0.36, start + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur * 1.1);
  o.connect(g); g.connect(musicGain);
  o.start(start); o.stop(start + dur * 1.2);

  const o2 = musicCtx.createOscillator();
  const g2 = musicCtx.createGain();
  o2.type = 'sine';
  o2.frequency.value = freq * 2;

  g2.gain.linearRampToValueAtTime(vol * 0.08, start + 0.12);
  g2.gain.exponentialRampToValueAtTime(0.001, start + dur * 0.9);

function playPad(freq, start, dur, vol) {
  if (!freq) return;
  const o = musicCtx.createOscillator();

  musicPlaying = false;

  if (musicGain) {
    musicGain.gain.cancelScheduledValues(musicCtx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, musicCtx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0, musicCtx.currentTime + 0.5);
  }
  updateBtn();
}
function updateBtn() {
  const b = document.getElementById('music');
  if (musicPlaying) {
    b.classList.add('on');
    b.textContent = '⏸ 暂停音乐';

    b.textContent = '▶ 播放音乐';

}

/* 拿走单个月饼 */
function take(btn, card){
  if(btn.classList.contains('taken'))return;
  const isHidden = btn.classList.contains('hidden-cake');
  playDing();
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const cakeClone = btn.querySelector('.vis').cloneNode(true);
  cakeClone.style.cssText = `
    position:fixed; left:${cx}px; top:${cy}px;
    width:${r.width}px; height:${r.height}px;
    transform:translate(-50%,-50%);
    pointer-events:none; z-index:10001;
    transition:all .5s cubic-bezier(.4,0,.6,1);
    will-change:transform,left,top,width,height,opacity;
  `;
  document.body.appendChild(cakeClone);
  if (isHidden) {
    burstGold(cx, cy);
  } else {
    burst(cx, cy, card.style.getPropertyValue('--c'));
  }
  btn.classList.add('taken');
  left--;
  card.querySelector('.cnt b').textContent =
    card.querySelectorAll('.cake:not(.taken)').length;
  stat();
  playEatAnimation(cx, cy, cakeClone, isHidden);
  if (isHidden) {
    setTimeout(()=>{
      playJackpot();
      const banner = document.createElement('div');
      banner.className = 'hidden-banner';
      banner.textContent = '🌟 恭喜！吃到隐藏款月饼！';
      document.body.appendChild(banner);
      requestAnimationFrame(()=>banner.classList.add('show'));
      setTimeout(()=>banner.remove(), 2800);
    }, 850);
  }
  if(!left) bless();
}

/* 一键拿完 */
function takeAll(){
  if(!left)return;
  const all=[...document.querySelectorAll('.cake:not(.taken)')];
  if(!all.length)return;
  const positions = all.map(btn=>{
    const r=btn.getBoundingClientRect();
    return { x:r.left+r.width/2, y:r.top+r.height/2, w:r.width, el:btn };
  });
  all.forEach(btn=>btn.classList.add('taken'));
  left=0;
  document.querySelectorAll('.flavor').forEach(card=>{
    card.querySelector('.cnt b').textContent='0';

  stat();

  bigRabbitEatsAll(positions);
  bless();
}

  setTimeout(()=>{

  }, 200);
});

document.addEventListener('DOMContentLoaded', ()=>{

  }, 400);
});

['click','touchstart','touchend','keydown','mousemove','scroll']
  .forEach(evt => {
    document.addEventListener(evt, tryAutoStart, {once: true, passive: true});

});

const wishHint = document.getElementById('wishHint');
const wishInput = document.getElementById('wishInput');
wishInput.addEventListener('input', ()=>{
  if (wishInput.value.trim()) wishHint.classList.add('hide');
});
document.getElementById('wishBtn').addEventListener('click', ()=>{
  const text = wishInput.value.trim();
  if(!text){
    wishInput.focus();
    wishInput.style.borderColor = '#ff9d9d';
    setTimeout(()=>{wishInput.style.borderColor='';}, 600);
    return;
  }
  releaseLantern(text);
  wishInput.value = '';
  playDing();
});
wishInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('wishBtn').click();
});

/* 烟花 */
function shootFirework(x, y){
  const colors = ['#ff6b9d','#ffd166','#5ce1e6','#b28dff',
                  '#ff9b54','#8ce99a','#ff7b7b','#ffe066'];
  const c1 = colors[Math.floor(Math.random()*colors.length)];
  const c2 = colors[Math.floor(Math.random()*colors.length)];
  const flash = document.createElement('div');
  flash.className = 'fx';
  flash.style.cssText = `left:${x}px;top:${y}px;width:60px;height:60px;
    border-radius:50%;background:radial-gradient(circle,#fff,${c1} 30%,transparent 70%);
    transform:translate(-50%,-50%);pointer-events:none`;
  document.body.appendChild(flash);
  flash.animate([
    {transform:'translate(-50%,-50%) scale(0.2)',opacity:1},
    {transform:'translate(-50%,-50%) scale(1.6)',opacity:0}
  ],{duration:520,easing:'ease-out'}).onfinish = ()=>flash.remove();
  const count = 30;
  const baseAngle = Math.random() * Math.PI * 2;
  for(let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'fx';
    const sz = 3 + Math.random() * 4;
    const c = i % 2 === 0 ? c1 : c2;
    p.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;
      border-radius:50%;background:${c};
      box-shadow:0 0 10px ${c}, 0 0 22px ${c}`;
    document.body.appendChild(p);
    const a = baseAngle + (i/count) * Math.PI * 2 + Math.random() * 0.18;
    const dist = 70 + Math.random() * 120;
    const dx = Math.cos(a) * dist;
    const dy = Math.sin(a) * dist;
    const dur = 750 + Math.random() * 450;
    p.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(0)`,opacity:0}
    ],{duration:dur, easing:'cubic-bezier(.2,.7,.3,1)'})
      .onfinish = ()=>p.remove();
  }
}
document.addEventListener('click', (e)=>{
  if(left > 0) return;
  if(e.target.closest('button, input, select, a, .rabbit, .wish-wrap, .lantern, .rabbit-bubble, .flavor-card, .moon, .slide-hint')) return;
  shootFirework(e.clientX, e.clientY);
});

/* 左侧滑动提示 */
const slideHint = document.getElementById('slideHint');
slideHint.addEventListener('click', () => {
  const wishWrap = document.querySelector('.wish-wrap');
  if (wishWrap) wishWrap.scrollIntoView({behavior:'smooth', block:'center'});
  playDing();
});
window.addEventListener('scroll', () => {
  const wishWrap = document.querySelector('.wish-wrap');
  if (!wishWrap) return;
  const rect = wishWrap.getBoundingClientRect();
  if (rect.top < window.innerHeight * 0.7) {
    slideHint.classList.add('hide');
  } else {
    slideHint.classList.remove('hide');
  }
}, {passive: true});

(function makeStars(){
  const box = document.getElementById('stars');
  let html = '';
  const total = 55;
  const twinkleCount = 18;
  for (let i = 0; i < total; i++) {
    const s = (Math.random() * 2 + 1).toFixed(1);
    const tw = i < twinkleCount ? ' tw' : '';
    html += `<i class="${tw.trim()}" style="
      left:${(Math.random() * 100).toFixed(2)}%;
      top:${(Math.random() * 70).toFixed(2)}%;
      width:${s}px; height:${s}px;
      animation-delay:${(Math.random() * 3.4).toFixed(2)}s;
      animation-duration:${(2.4 + Math.random() * 2.6).toFixed(2)}s"></i>`;
  }
  box.innerHTML = html;
})();
