</html><!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中秋月饼铺</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#060a18,#17204a);color:#f6efe0;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
main{max-width:1000px;margin:auto;padding:36px 16px 60px;position:relative;z-index:1}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.bar label{font-size:14px;color:#ffffff99;line-height:40px}
.bar input{font:inherit;font-size:15px;width:190px;padding:10px 16px;text-align:center;
  border-radius:99px;border:1px solid #ffdc8c4d;background:#ffffff0f;color:#fff8e2;outline:none}
.bar input:focus{border-color:#ffdc8ca6}
h1{margin:0 0 14px;text-align:center;font-size:clamp(22px,5vw,38px);letter-spacing:4px;
  background:linear-gradient(#fff9e2,#f8d271,#dc9a22);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.status{display:block;width:fit-content;margin:0 auto 18px;padding:8px 22px;border-radius:99px;
  font-size:14px;color:#ffe9a8;background:#ffdc8c14;border:1px solid #ffdc8c38}
.status b{color:#fff3c4;font-size:17px}
.status.done{color:#0d1433;font-weight:700;background:linear-gradient(135deg,#ffeaa8,#f5c04f);
  border-color:transparent}
.btns{display:flex;justify-content:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.btns button{font:inherit;font-size:14px;padding:10px 24px;border-radius:99px;cursor:pointer;
  color:#ffe9a8;background:#ffdc8c1a;border:1px solid #ffdc8c5c;transition:.25s}
.btns button:hover{background:#ffdc8c33;transform:translateY(-2px);
  box-shadow:0 8px 22px #ffc85033}
.btns button:active{transform:translateY(0)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.flavor{position:relative;padding:14px 18px 18px;border-radius:18px;
  background:#ffffff0b;border:1px solid #ffffff17;overflow:hidden}
.flavor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.nm{font-size:15px;font-weight:600}
.cnt{margin-left:auto;font-size:12px;color:#ffffff73}
.cnt b{color:#ffe08a;font-size:13px}
.cakes{display:flex;flex-wrap:wrap;gap:9px;min-height:46px}
.cake{position:relative;width:46px;height:46px;padding:0;border:0;background:none;cursor:pointer;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes pop{from{transform:scale(.1) rotate(-35deg);opacity:0}}
.cake::before{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px #ffffff1f;opacity:0;transition:opacity .3s .12s}
.cake.taken{pointer-events:none}
.cake.taken::before{opacity:1}
.vis{display:block;width:100%;height:100%;transition:transform .22s,filter .22s,opacity .22s}
.vis svg{display:block;width:100%;height:100%}
.cake:not(.taken):hover .vis{transform:translateY(-5px) scale(1.14);
  filter:drop-shadow(0 0 10px var(--c))}
.cake.taken .vis{transform:translateY(-46px) scale(.1) rotate(30deg);opacity:0;
  transition:transform .5s ease-in,opacity .42s ease-in}

/* ===== 祝福区 ===== */
.bless{margin-top:40px;text-align:center;opacity:0;transform:translateY(18px);
  transition:.7s;pointer-events:none}
.bless.show{opacity:1;transform:none;pointer-events:auto}
.bless h2{margin:0 0 10px;font-size:clamp(20px,4vw,30px);letter-spacing:2px;
  background:linear-gradient(#fff9e2,#f8d271,#dc9a22);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.bless p{margin:0 0 20px;font-size:14px;color:#fff0d29e;letter-spacing:2px;line-height:1.9}

/* ===== 玉兔 ===== */
.rabbit-wrap{display:flex;justify-content:center;margin-top:10px}
.rabbit{position:relative;width:180px;height:200px;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{
  0%,100%{transform:translateY(0)}
  30%{transform:translateY(-14px)}
  50%{transform:translateY(0) scaleY(.96)}
  70%{transform:translateY(-6px)}
}
.rabbit svg{width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 10px 22px #00000059)}

/* 耳朵抖动 */
.ear-l{transform-origin:36px 62px;animation:earL 2.4s ease-in-out infinite}
.ear-r{transform-origin:84px 62px;animation:earR 2.4s ease-in-out infinite .2s}
@keyframes earL{
  0%,70%,100%{transform:rotate(0)}
  78%{transform:rotate(-14deg)}
  88%{transform:rotate(6deg)}
}
@keyframes earR{
  0%,70%,100%{transform:rotate(0)}
  78%{transform:rotate(14deg)}
  88%{transform:rotate(-6deg)}
}

/* 眨眼 */
.eye{animation:blink 3.6s infinite}
@keyframes blink{
  0%,92%,100%{transform:scaleY(1)}
  96%{transform:scaleY(.08)}
}

/* 腮红呼吸 */
.blush{animation:blush 2.2s ease-in-out infinite}
@keyframes blush{0%,100%{opacity:.55}50%{opacity:.9}}

/* 小尾巴摇 */
.tail{transform-origin:36px 156px;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{
  0%,100%{transform:rotate(-14deg)}
  50%{transform:rotate(14deg)}
}

/* 抱着的月饼轻微晃动 */
.cake-hug{transform-origin:60px 150px;animation:hug 2s ease-in-out infinite}
@keyframes hug{
  0%,100%{transform:rotate(-4deg)}
  50%{transform:rotate(4deg)}
}

/* 飘浮的爱心 */
.heart{position:fixed;pointer-events:none;z-index:9999;font-size:20px;
  animation:floatUp 2.2s ease-out forwards}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  20%{opacity:1;transform:translate(-50%,-80%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-220%) scale(.9)}
}

.fx{position:fixed;pointer-events:none;z-index:9999;will-change:transform,opacity}
@media(max-width:400px){.cake{width:40px;height:40px}.cakes{gap:7px}
  .rabbit{width:150px;height:170px}}
</style>
</head>
<body>
<main>
  <div class="bar">
    <label for="who">这份月饼送给：</label>
    <input id="who" placeholder="写下名字..." maxlength="12" autocomplete="off">
  </div>
  <h1>🌕 中秋月饼铺 🌕</h1>
  <div class="status" id="st"></div>
  <div class="btns">
    <button id="all">🎁 一键拿完</button>
    <button id="reset">🔄 重新摆满</button>
  </div>
  <div class="board" id="bd"></div>

  <div class="bless" id="bl">
    <h2 id="gt"></h2>
    <p>愿月光所至，万事胜意<br>中秋快乐，平安喜乐</p >

    <!-- 玉兔 -->
    <div class="rabbit-wrap">
      <div class="rabbit">
        <svg viewBox="0 0 120 190">
          <!-- 尾巴 -->
          <circle class="tail" cx="36" cy="156" r="9" fill="#fff5e8"/>

          <!-- 耳朵 -->
          <ellipse class="ear-l" cx="36" cy="42" rx="9" ry="26" fill="#fff5e8"
                   stroke="#e8c9b0" stroke-width="1.5"/>
          <ellipse cx="36" cy="44" rx="4" ry="17" fill="#ffc9d6"/>
          <ellipse class="ear-r" cx="84" cy="42" rx="9" ry="26" fill="#fff5e8"
                   stroke="#e8c9b0" stroke-width="1.5"/>
          <ellipse cx="84" cy="44" rx="4" ry="17" fill="#ffc9d6"/>

          <!-- 身体 -->
          <ellipse cx="60" cy="140" rx="34" ry="32" fill="#fff5e8"
                   stroke="#e8c9b0" stroke-width="1.5"/>

          <!-- 头 -->
          <ellipse cx="60" cy="92" rx="33" ry="30" fill="#fffaf0"
                   stroke="#e8c9b0" stroke-width="1.5"/>

          <!-- 眼睛 -->
          <ellipse class="eye" cx="48" cy="90" rx="4" ry="5" fill="#3a2a22"
                   style="transform-origin:48px 90px"/>
          <ellipse class="eye" cx="72" cy="90" rx="4" ry="5" fill="#3a2a22"
                   style="transform-origin:72px 90px"/>
          <!-- 眼睛高光 -->
          <circle cx="49" cy="88" r="1.5" fill="#fff"/>
          <circle cx="73" cy="88" r="1.5" fill="#fff"/>

          <!-- 腮红 -->
          <ellipse class="blush" cx="38" cy="100" rx="6" ry="4" fill="#ffb3c1"/>
          <ellipse class="blush" cx="82" cy="100" rx="6" ry="4" fill="#ffb3c1"/>

          <!-- 鼻子和嘴 -->
          <ellipse cx="60" cy="98" rx="3" ry="2.2" fill="#ff9eb0"/>
          <path d="M60 100 Q57 105 54 102 M60 100 Q63 105 66 102"
                stroke="#c98a7a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

          <!-- 抱着的月饼 -->
          <g class="cake-hug">
            <circle cx="60" cy="150" r="17" fill="#d08b70"
                    stroke="#a04e35" stroke-width="1.5"/>
            <circle cx="60" cy="150" r="12" fill="none"
                    stroke="#ffffff66" stroke-width="1.1" stroke-dasharray="3 3"/>
            <text x="60" y="155" text-anchor="middle" font-size="12" fill="#fff">🥮</text>
          </g>

          <!-- 小爪子 -->
          <ellipse cx="40" cy="150" rx="7" ry="5" fill="#fffaf0"
                   stroke="#e8c9b0" stroke-width="1.2"/>
          <ellipse cx="80" cy="150" rx="7" ry="5" fill="#fffaf0"
                   stroke="#e8c9b0" stroke-width="1.2"/>
        </svg>
      </div>
    </div>
  </div>
</main>

<script>
const F=[
 ['豆沙馅','#a04e35','#d08b70','#66301d'],
 ['抹茶馅','#6fa84a','#b3dd8c','#3c6526'],
 ['五仁馅','#c08f4a','#ecc98d','#855a24'],
 ['蛋黄馅','#f0a83c','#ffdc8a','#b06c17'],
 ['榴莲馅','#e8c84a','#fff0a8','#a8851b'],
 ['酸笋馅','#b5cc4e','#e8f2a0','#7c9225'],
 ['苦瓜馅','#7fb77e','#b8e2b0','#4b7d46'],
 ['奶茶馅','#c9a87c','#f0dfc0','#8f7248'],
 ['鲜肉馅','#e07a6e','#ffb9a8','#a5473d'],
 ['枣泥馅','#7a3b2e','#b06a56','#421a12']
],N=7,B=document.getElementById('bd'),S=document.getElementById('st'),
  L=document.getElementById('bl'),G=document.getElementById('gt'),
  W=document.getElementById('who'),T=F.length*N;
let left=T,u=0,timers=[];

const svg=(n,b,l,d)=>{
 const id='g'+u++;
 let p='';
 for(let i=0;i<8;i++)p+=`<ellipse cx="50" cy="27" rx="6.4" ry="11" transform="rotate(${i*45} 50 50)"/>`;
 return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx="35%" cy="28%" r="78%">
 <stop offset="0%" stop-color="${l}"/><stop offset="62%" stop-color="${b}"/>
 <stop offset="100%" stop-color="${d}"/></radialGradient></defs>
 <circle cx="50" cy="53" r="45" fill="#00000059"/>
 <circle cx="50" cy="50" r="45" fill="url(#${id})" stroke="${d}" stroke-width="1.5"/>
 <g fill="#ffffff26" stroke="#ffffff4d" stroke-width=".9">${p}</g>
 <circle cx="50" cy="50" r="9.5" fill="#ffffff38" stroke="#ffffff80" stroke-width="1.1"/>
 <ellipse cx="33" cy="29" rx="12" ry="7" transform="rotate(-32 33 29)" fill="#ffffff29"/>
 </svg>`;
};

/* ===== 粒子特效 ===== */
function burst(x,y,color){
 for(let i=0;i<12;i++){
  const p=document.createElement('div');
  p.className='fx';
  const sz=3+Math.random()*5;
  p.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;
    border-radius:50%;background:${color};box-shadow:0 0 8px ${color}`;
  document.body.appendChild(p);
  const a=Math.random()*Math.PI*2,r=40+Math.random()*70;
  const dx=Math.cos(a)*r,dy=Math.sin(a)*r;
  const dur=500+Math.random()*300;
  p.animate([
   {transform:'translate(-50%,-50%) scale(1)',opacity:1},
   {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(0)`,opacity:0}
  ],{duration:dur,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove();
 }
}

function floatText(x,y,txt){
 const t=document.createElement('div');
 t.className='fx';
 t.textContent=txt;
 t.style.cssText=`left:${x}px;top:${y}px;transform:translate(-50%,-50%);
   font-size:18px;font-weight:800;color:#ffe08a;text-shadow:0 2px 10px #ffa04080;
   white-space:nowrap`;
 document.body.appendChild(t);
 t.animate([
  {transform:'translate(-50%,-50%) scale(.6)',opacity:0},
  {transform:'translate(-50%,-90%) scale(1.15)',opacity:1,offset:.3},
  {transform:'translate(-50%,-180%) scale(1)',opacity:0}
 ],{duration:900,easing:'ease-out'}).onfinish=()=>t.remove();
}

/* ===== 玉兔撒爱心 ===== */
function rabbitHearts(){
 const r=document.querySelector('.rabbit').getBoundingClientRect();
 const cx=r.left+r.width/2, cy=r.top+r.height*0.3;
 const hearts=['💗','💖','💕','✨','🌙'];
 for(let i=0;i<8;i++){
  const h=document.createElement('div');
  h.className='heart';
  h.textContent=hearts[i%hearts.length];
  h.style.left=(cx+(Math.random()-0.5)*90)+'px';
  h.style.top=cy+'px';
  h.style.animationDelay=(i*120)+'ms';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),2800+i*120);
 }
}

/* ===== 构建 ===== */
function build(){
 timers.forEach(clearTimeout);timers=[];
 B.innerHTML='';L.classList.remove('show');u=0;left=T;
 F.forEach(([nm,base,light,dark],fi)=>{
  const c=document.createElement('div');
  c.className='flavor';c.style.setProperty('--c',base);
  c.innerHTML=`<div class="head"><span class="dot"></span><span class="nm">${nm}</span>
   <span class="cnt"><b>${N}</b> / ${N}</span></div>`;
  const box=document.createElement('div');box.className='cakes';
  for(let i=0;i<N;i++){
   const btn=document.createElement('button');
   btn.className='cake';btn.style.animationDelay=fi*40+i*35+'ms';
   btn.innerHTML=`<span class="vis">${svg(nm,base,light,dark)}</span>`;
   btn.onclick=()=>take(btn,c);
   box.appendChild(btn);
  }
  c.appendChild(box);B.appendChild(c);
 });
 stat();
}

/* ===== 拿走 ===== */
function take(btn,card){
 if(btn.classList.contains('taken'))return;
 btn.classList.add('taken');
 left--;
 const r=btn.getBoundingClientRect();
 const cx=r.left+r.width/2, cy=r.top+r.height/2;
 const color=card.style.getPropertyValue('--c');
 burst(cx,cy,color);
 floatText(cx,cy,'🥮');
 card.querySelector('.cnt b').textContent=
   card.querySelectorAll('.cake:not(.taken)').length;
 stat();
 if(!left)bless();
}

/* ===== 一键拿完 ===== */
function takeAll(){
 const all=[...document.querySelectorAll('.cake:not(.taken)')];
 if(!all.length)return;
 all.forEach((btn,i)=>{
  const t=setTimeout(()=>{
   const card=btn.closest('.flavor');
   take(btn,card);
  },i*45);
  timers.push(t);
 });
}

/* ===== 状态 ===== */
const stat=()=>{
 if(!left){S.classList.add('done');S.textContent='🎉 月饼都被拿光啦';}
 else{S.classList.remove('done');S.innerHTML=`还剩 <b>${left}</b> 块月饼 · 点一下拿走`;}
};

/* ===== 祝福 + 玉兔出场 ===== */
const bless=()=>{
 G.textContent='🌕 中秋快乐，'+(W.value.trim()||'你');
 L.classList.add('show');
 setTimeout(rabbitHearts,600);
 setTimeout(rabbitHearts,2000);
 setTimeout(rabbitHearts,3400);
};

W.oninput=()=>{if(!left)bless();};
document.getElementById('all').onclick=takeAll;
document.getElementById('reset').onclick=build;
build();
</script>
</body>
</html>
